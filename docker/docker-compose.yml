services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: fanatico_sqlserver
    environment:
      SA_PASSWORD: "Fanatico@Dev2026!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - fanatico_sqlserver_data:/var/opt/mssql

volumes:
  fanatico_sqlserver_data: